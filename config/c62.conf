# Match the working Lisa C62 baseline, excluding unused vendor services.
CONFIG_SPI_CSK6=n
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y
CONFIG_ARM_MPU=y
# The project driver protects GPIO port RMW shared by RF, keypad and display.
CONFIG_GPIO_CSK6=n
CONFIG_ADC_CSK6=n
CONFIG_HW_STACK_PROTECTION=y
# Startup loads the codeplug on the main/radio stack. The manifest decoder
# alone uses about 1.3 KiB; callers and exception context exceed 2 KiB together.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_CSK_HEAP=y
CONFIG_CSK_HEAP_MEM_POOL_SIZE=307200
CONFIG_CSK6_PSRAM=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# Reserve UART2 for the runtime companion toggle, including startup.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_SHELL=n
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_CSK6_LOCK=y
CONFIG_CSK6_FLASH_STALL_SECOND_CORE=n
CONFIG_LSF=y
CONFIG_LSF_CLIENT=y
CONFIG_LSF_OS_ZEPHYR=y
CONFIG_LSF_IC_MESSAGE=y
CONFIG_FREERTOS_SHIMS=y
