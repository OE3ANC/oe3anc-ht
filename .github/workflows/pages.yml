# SPDX-License-Identifier: GPL-3.0-or-later
name: Companion GitHub Pages
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-pages
  cancel-in-progress: false
jobs:
  assemble:
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Stage verified published companions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PAGES_RELEASE_ID: ${{ github.event.release.id }}
        run: python3 companion/deploy_pages.py --repository "$RELEASE_REPOSITORY" --output build/pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/pages
  deploy:
    needs: assemble
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy companion
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
